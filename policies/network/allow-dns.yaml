# EXAMPLE ONLY — not certified PCI compliance.
# Allow DNS egress so default-deny NetworkPolicies do not break name resolution.
# Targets kube-dns / CoreDNS in kube-system (UDP/TCP 53).
# Adjust namespace/pod labels if your cluster uses a different DNS setup.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress-example
  namespace: fintech-workloads
  labels:
    app.kubernetes.io/part-of: k8s-fintech-baseline
    example: "true"
  annotations:
    description: "EXAMPLE allow DNS egress (UDP/TCP 53) to kube-system DNS"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
