# EXAMPLE overlay: full baseline without allow-same-namespace (stricter isolation).
# Build requires: kubectl kustomize overlays/fintech-baseline --load-restrictor=LoadRestrictionsNone
# (resources live in repo root policies/ — outside this directory)
# WARNING: default-deny without same-ns allow. Not certified PCI compliance.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../examples/namespace.yaml
  - ../../policies/pss/restricted-baseline.yaml
  - ../../policies/pss/disallow-hostpath.yaml
  - ../../policies/pss/disallow-privileged-ports.yaml
  - ../../policies/rbac/deny-cluster-admin-binding.yaml
  - ../../policies/network/deny-all-default.yaml
  - ../../policies/network/allow-dns.yaml
  - ../../policies/network/allow-https-egress.yaml
