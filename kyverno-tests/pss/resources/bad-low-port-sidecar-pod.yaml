apiVersion: v1
kind: Pod
metadata:
  name: bad-low-port-sidecar-pod
  namespace: fintech-workloads
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  initContainers:
    # Native sidecar (restartPolicy: Always) keeps running and binds :80.
    - name: proxy
      image: busybox:1.36
      restartPolicy: Always
      ports:
        - containerPort: 80
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        privileged: false
        capabilities:
          drop:
            - ALL
  containers:
    - name: app
      image: busybox:1.36
      ports:
        - containerPort: 8080
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        privileged: false
        capabilities:
          drop:
            - ALL
