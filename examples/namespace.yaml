# EXAMPLE namespace for FinTech workloads baseline demos.
# Labels are illustrative for policy selection / documentation — adapt to your org.
apiVersion: v1
kind: Namespace
metadata:
  name: fintech-workloads
  labels:
    app.kubernetes.io/part-of: k8s-fintech-baseline
    example: "true"
    # Illustrative environment / sensitivity tags (not a compliance claim)
    environment: staging
    sensitivity: fintech-example
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
